# Loaded with -config.expand-env=true, so ${VAR:-default} references resolve from the environment.
# Logs arrive via OTLP (Alloy -> http://loki:3100/otlp). Loki's default otlp_config indexes the
# `service.name` resource attribute as the `service_name` label and keeps trace_id/span_id as
# structured metadata.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
