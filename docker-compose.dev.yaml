services:
  web-api:
    build:
      target: dev
    environment:
      SMTP_HOST: mailpit
    volumes:
      - ./web-api:/app
      - web_api_venv:/app/.venv

  worker:
    build:
      target: dev
    volumes:
      - ./web-api:/app
      - worker_venv:/app/.venv

  web:
    build:
      target: dev
    ports: !override
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  web_api_venv:
  worker_venv:
  web_node_modules:
